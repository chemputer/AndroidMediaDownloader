name: Build and Publish Signed Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            git \
            ffmpeg \
            ccache \
            zip \
            unzip \
            libffi-dev \
            libssl-dev \
            libtinfo6 \
            libstdc++6 \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            lld

      - name: Install uv and Build Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv pip install --system "cython<3.0.0" buildozer Kivy yt-dlp RedDownloader

      - name: Cache Buildozer Directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build Release APK with Buildozer
        run: |
          buildozer -v android release

      - name: Sign Release APK
        run: |
          # Decode the base64 keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

          # Locate Android build-tools (apksigner & zipalign)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)

          # Find the release APK generated by Buildozer
          RAW_APK=$(find bin/ -name "*.apk" | head -n 1)

          # Align the APK
          $BUILD_TOOLS_DIR/zipalign -f -v 4 "$RAW_APK" app-aligned.apk

          # Sign the aligned APK
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out mediadl-release-signed.apk \
            app-aligned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: mediadl-release-signed.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedFile }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}